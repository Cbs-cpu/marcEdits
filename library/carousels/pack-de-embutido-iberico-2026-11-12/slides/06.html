<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../../../tools/carruseles/base.css"><style>
.stack{display:flex;flex-direction:column;align-items:center;text-align:center;gap:0}
.stack p{margin:0}
.big .tt{font-size:70px}
#art{position:absolute;inset:0;width:1080px;height:1920px}

.note{background:#fff;color:#111;border-radius:36px;padding:44px 48px;box-shadow:0 18px 0 rgba(43,22,16,.18);border:6px solid #2b1610;text-align:left}
.note .top{font-size:30px;color:#e0a100;font-weight:600;margin-bottom:22px}
.note h2{font-size:56px;font-weight:800;line-height:1.12;margin-bottom:26px}
.note p{font-size:44px;font-weight:500;line-height:1.32;margin-bottom:22px}
.note .x{color:#e5332a;font-weight:800}
</style></head><body><svg id="art" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg><script src="../assets/toons.js"></script>
<script>draw(background("#ffe27a","#ffb21a",{rays:[460,1200]})
 + shadow(210,1420,110) + T(210,1220,.88,chorizo("happy","wave"))
 + shadow(470,1420,140) + T(470,1260,.9,lomo("happy","up"))
 + shadow(740,1430,110) + T(740,1220,.88,salchichon("happy","wave"))
 + heart(130,880,.9) + heart(860,860,.7,"#ff7a1a") + heart(470,940,.55) + spark(960,1100,.8) + spark(80,1120,.6))</script>
<div class="safe"><div class="stack" style="line-height:1.4">

</div></div></body></html>
