<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../../../tools/carruseles/base.css"><style>
.stack{display:flex;flex-direction:column;align-items:center;text-align:center;gap:0}

</style></head><body><svg id="art" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg><script src="../assets/toons.js"></script>
<script>draw(background("#b6f2d6","#5fd3a3",{rays:[460,1150]})
 + T(200,1010,.78,chorizo("happy","up")) + T(200,1270,.82,sobre("chorizo","CHORIZO"),-4)
 + T(470,1030,.72,lomo("happy","up")) + T(470,1250,.82,sobre("lomo","LOMO"))

<p><span class="tt white">Ahora siempre tengo</span></p>

</div></div></body></html>
