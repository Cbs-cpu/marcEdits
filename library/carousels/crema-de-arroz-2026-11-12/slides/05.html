<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../../../tools/carruseles/base.css"><style>
.stack{display:flex;flex-direction:column;align-items:center;text-align:center}
.stack.l{align-items:flex-start;text-align:left}
.stack p{margin:0}
.big .tt{font-size:74px}
.tt{font-size:60px}
#art{position:absolute;inset:0;width:1080px;height:1920px}
.tt.white,.tt.red{box-shadow:0 6px 0 rgba(43,22,16,.18)}
.step{position:absolute;left:0;top:0;width:220px;height:220px;border-radius:50%;background:#fe2c55;border:9px solid #2b1610;
 display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;box-shadow:0 12px 0 rgba(43,22,16,.2)}
.step small{font-weight:800;font-size:34px;letter-spacing:.08em;margin-bottom:-14px}
.step b{font-weight:900;font-size:150px;line-height:.9}
.txt{position:absolute;left:0;right:0;top:250px}
.sub .tt{font-size:48px;font-weight:600}
.photo{position:absolute;background:#fff;padding:16px 16px 54px;border:6px solid #2b1610;border-radius:14px;box-shadow:0 14px 0 rgba(43,22,16,.2)}
.photo img{display:block;width:250px;border-radius:6px}
.photo span{position:absolute;left:0;right:0;bottom:8px;text-align:center;color:#2b1610;font-weight:700;font-size:28px}
</style></head><body><svg id="art" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg><script src="../assets/toons.js"></script>
<script>draw(background("#ece4ff","#9b7cff",{rays:[540,1150]})
 + shadow(380,1490,220) + T(380,1300,1,cremaBowl("happy",{toppings:true,arms:"up"}))
 + dumbbell(380,900,.7) + shadow(820,1480,120) + T(820,1250,.85,milk("happy","wave"))
 + bolt(150,980,.7) + spark(960,900,.6) + spark(110,1320,.6))</script>
<div class="safe"><div class="stack l" style="line-height:1.42">
<p><span class="tt red" style="font-size:66px">Truco extra</span></p>
<p style="height:18px"></p>
<p><span class="tt white">Hazla con leche en vez</span></p>
<p><span class="tt white">de agua: queda más cremosa</span></p>
<p><span class="tt white">y sumas más proteína</span></p>
</div></div></body></html>
